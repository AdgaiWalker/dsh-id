name: 功能建议
description: 希望它多做什么 / 少做什么
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 先说场景，再说功能。避免只给方案。
      placeholder: 每次换账号都要手工改白名单，希望能批量改
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
    validations: { required: false }
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块
      options:
        - 凭据 / exec
        - 会话 / 浏览器
        - 面板
        - 审计 / 日志
        - 插件（DSH bundle）
        - 其他
    validations: { required: true }
