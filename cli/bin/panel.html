<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-id · 账号面板</title>
<style>
  :root{--ink:#111;--ink2:#666;--line:#e3e3e3;--bg:#fafafa;--card:#fff;--accent:#1a6b4f;--danger:#b3261e;--warn:#8a5a00}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;color:var(--ink);background:var(--bg)}
  header{padding:16px 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;letter-spacing:.3px}
  .sub{color:var(--ink2);font-size:12px;margin-top:4px}
  .warn{margin:10px 16px 0;padding:8px 10px;border:1px solid #f0d9a8;background:#fff8e8;color:var(--warn);font-size:12px;border-radius:8px}
  main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
  section > h2{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .count{color:var(--ink2);font-weight:400;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink2);font-weight:500;font-size:12px;background:#fcfcfc}
  tr:last-child td{border-bottom:0}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .domains{color:var(--ink2)}
  .subline{display:none;color:var(--ink2);font-size:12px;margin-top:2px}
  button{font:inherit;font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{color:var(--danger);border-color:#f0c9c5}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
  form.add input,form.add select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff}
  form.add .full{grid-column:1/-1}
  .hint{color:var(--ink2);font-size:12px;padding:0 14px 10px}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
  .ok{color:var(--accent)} .bad{color:var(--danger)} .unknown{color:var(--warn)}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
  #toast.show{opacity:.95}
  @media (max-width:520px){
    form.add{grid-template-columns:1fr}
    th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){display:none}
    .subline{display:block}
  }
</style>
</head>
<body>
<header>
  <h1>dsh-id · 账号面板</h1>
  <div class="sub"><span id="ver">v…</span> · <span id="vault">加载中…</span></div>
  <div class="row-actions" style="margin-top:8px">
    <button id="btnUpdate">检查更新</button>
    <a href="https://github.com/AdgaiWalker/dsh-id" target="_blank" rel="noreferrer"><button>仓库</button></a>
    <a href="https://github.com/AdgaiWalker/dsh-id#readme" target="_blank" rel="noreferrer"><button>文档</button></a>
    <button id="btnFeedback">报告问题</button>
  </div>
</header>
<div class="warn">只绑 127.0.0.1。这一页能看到账号名和域名，永远看不到密码/令牌值。</div>
<main>
  <section>
    <h2>凭据 <span class="count" id="credCount"></span></h2>
    <div id="creds"></div>
    <form class="add" id="addForm" autocomplete="off">
      <input name="name" placeholder="名字，如 github-pat" required>
      <select name="type">
        <option value="bearer">bearer（Authorization: Bearer）</option>
        <option value="basic">basic（用户名:密码）</option>
        <option value="header">header（自定义头）</option>
        <option value="query">query（拼查询参数）</option>
      </select>
      <input name="domains" class="full" placeholder="域名白名单，逗号分隔，如 api.github.com,*.example.com" required>
      <input name="header_name" placeholder="header 类型的请求头名（可选）">
      <input name="param_name" placeholder="query 类型的参数名（可选）">
      <input name="secret" class="full" type="password" placeholder="凭据值（只提交一次，不回显）" autocomplete="new-password" required>
      <div class="full row-actions"><button class="primary" type="submit">新增凭据</button></div>
    </form>
  </section>

  <section>
    <h2>网页会话 <span class="count" id="sessCount"></span></h2>
    <div id="sessions"></div>
  </section>

  <section>
    <h2>运行日志 <span class="count" id="logCount"></span></h2>
    <div id="logs"></div>
    <div class="hint">按天一个文件，保留 14 天；只记动作/名字/主机/结果，不记 URL 与凭据值。</div>
  </section>

  <section>
    <h2>审计与恢复</h2>
    <table>
      <tr><th style="width:120px">审计链</th><td id="audit">…</td></tr>
      <tr><th>待审批</th><td id="pending">…</td></tr>
      <tr><th>隔离目录</th><td id="quar">…</td></tr>
    </table>
    <div class="hint row-actions" style="padding:12px 14px">
      <button id="btnRevoke">生成待吊销清单</button>
      <button id="btnVerify">重新校验审计链</button>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const H = {"X-DSH-ID": "dsh-id-panel", "Content-Type": "application/json"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer;
function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.background = bad ? "#b3261e" : "#111";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function post(body) {
  const r = await fetch("/api/action", {method: "POST", headers: H, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok: false, message: "响应不是 JSON"}));
  toast(j.message || (j.ok ? "完成" : "失败"), !j.ok);
  if (j.ok) load();
  return j;
}
function table(headers, rows) {
  if (!rows.length) return '<div class="hint">还没有。</div>';
  const th = headers.map(h => `<th>${h}</th>`).join("");
  const tr = rows.map(cells => `<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}
function pill(ok) {
  return ok ? '<span class="pill ok">有效期内</span>' : '<span class="pill bad">已过期</span>';
}
async function load() {
  const r = await fetch("/api/state");
  const s = await r.json();
  $("#vault").textContent = s.vault;
  $("#ver").textContent = "v" + s.version;
  window.__state = s;
  $("#logCount").textContent = s.logs.length + " 条";
  $("#logs").innerHTML = table(["时间", "动作", "详情"], (s.logs.slice(-12).reverse()).map(l => [
    `<span class="mono">${esc((l.ts || "").slice(11))}</span>`,
    `<span class="mono">${esc(l.action)}</span>`,
    `<span class="domains">${esc(Object.entries(l).filter(([k]) => k !== "ts" && k !== "action").map(([k, v]) => k + "=" + v).join(" "))}</span>`
  ]));
  $("#credCount").textContent = s.creds.length + " 个";
  $("#sessCount").textContent = s.sessions.length + " 个";
  const leaseCell = (c) => c.lease_state === "none" ? '<span class="domains">无租约</span>'
    : c.lease_state === "expired" ? `<span class="bad">已过期 ${Math.abs(c.days_left)} 天</span>`
    : `<span class="ok">剩 ${c.days_left} 天</span>`;
  $("#creds").innerHTML = table(["名字", "类型", "白名单", "租约", "操作"], s.creds.map(c => [
    `<span class="mono">${esc(c.name)}</span><div class="subline">${esc(c.type)} · ${esc(c.domains.join(", "))} · ${c.lease_state === "none" ? "无租约" : (c.lease_state === "expired" ? "已过期 " + Math.abs(c.days_left) + " 天" : "剩 " + c.days_left + " 天")}</div>`,
    esc(c.type),
    `<span class="domains mono">${esc(c.domains.join(", "))}</span>`,
    leaseCell(c),
    `<div class="row-actions">
       <button onclick="rotate('${esc(c.name)}')">轮换</button>
       <button onclick="setLease('${esc(c.name)}', ${c.lease || 0})">设租约</button>
       <button onclick="editDomains('${esc(c.name)}','${esc(c.domains.join(","))}')">改白名单</button>
       <button class="danger" onclick="rmCred('${esc(c.name)}')">删除</button>
     </div>`
  ]));
  const now = Date.now() / 1000;
  $("#sessions").innerHTML = table(["名字", "域名", "保存", "操作"], s.sessions.map(x => [
    `<span class="mono">${esc(x.name)}</span>`,
    esc(x.domain),
    `${esc(x.saved)} ${pill(!x.expires || true)}`,
    `<div class="row-actions">
       <button onclick="checkSess('${esc(x.name)}')">探一次</button>
       <button class="danger" onclick="rmSess('${esc(x.name)}')">删除</button>
     </div>`
  ]));
  const a = s.audit;
  $("#audit").innerHTML = a.state === "ok"
    ? `<span class="ok">✓ 完整</span> <span class="domains">（${a.rows} 行${a.legacy ? `，旧格式 ${a.legacy} 行` : ""}）</span>`
    : a.state === "unknown"
      ? `<span class="unknown">? 无法校验</span> <span class="domains">${esc(a.detail)}</span>`
      : `<span class="bad">✗ 异常</span> <span class="domains">${esc(a.detail)}</span>`;
  $("#pending").textContent = s.pending ? s.pending + " 件待批准" : "没有待批准的操作";
  $("#quar").textContent = s.quarantines.length ? s.quarantines.join(", ") : "无隔离中的密文";
  window.__types = s.types;
}
async function rotate(name) {
  const v = prompt(`给 ${name} 输入新的凭据值（只在这一次提交，不回显、不保存明文）`);
  if (!v) return;
  await post({op: "cred_rotate", name, secret: v});
}
async function setLease(name, cur) {
  const v = prompt(`给 ${name} 设租约天数（0 = 不设，从今天重新计时）`, cur || 90);
  if (v === null) return;
  await post({op: "cred_lease", name, days: parseInt(v, 10) || 0});
}
function editDomains(name, cur) {
  const v = prompt(`改 ${name} 的域名白名单（逗号分隔）`, cur);
  if (v === null) return;
  post({op: "cred_domains", name, domains: v});
}
function rmCred(name) {
  if (!confirm(`删除凭据 ${name}？密文和元数据都会删掉，不可恢复（除非有备份）。`)) return;
  post({op: "cred_rm", name});
}
function rmSess(name) {
  if (!confirm(`删除会话 ${name}？之后要重新登录这个站。`)) return;
  post({op: "session_rm", name});
}
function checkSess(name) { post({op: "session_check", name}); }
$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {op: "cred_add"};
  f.forEach((v, k) => { body[k] = v; });
  if (!body.secret) { toast("缺凭据值", true); return; }
  const j = await post(body);
  if (j.ok) e.target.reset();
});
$("#btnUpdate").onclick = () => post({op: "check_update"});
$("#btnFeedback").onclick = () => {
  const s = window.__state || {};
  const body = ["## 发生了什么", "", "（一句话描述）", "",
    "## 诊断（自动生成，无凭据值）", "```json",
    JSON.stringify({version: s.version, vault: s.vault, audit: s.audit,
                    creds: (s.creds || []).map(c => [c.name, c.type, c.lease_state]),
                    sessions: (s.sessions || []).map(x => [x.name, x.domain]),
                    logs: (s.logs || []).slice(-5)}, null, 1),
    "```"].join("\n");
  const url = "https://github.com/AdgaiWalker/dsh-id/issues/new?labels=bug&title=" +
    encodeURIComponent("[bug] ") + "&body=" + encodeURIComponent(body);
  window.open(url, "_blank", "noopener");
};
$("#btnRevoke").onclick = () => post({op: "revoke_list"});
$("#btnVerify").onclick = () => post({op: "audit_verify"});
load();
</script>
</body>
</html>
